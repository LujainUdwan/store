<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <section id="page-header">
        <h2>Contact Us</h2>
        <p>We'd love to hear from you</p>
    </section>

    <section id="contact" class="section-p1">
        <div class="contact-container">
            <div class="contact-info">
                <h3>Get In Touch</h3>
                <p><i class="fas fa-map-marker-alt"></i> 343 Amman, Street 10</p>
                <p><i class="fas fa-clock"></i> 11:00 - 22:00, Sunday - Thursday</p>
                <p><i class="fas fa-envelope"></i> support@yourstore.com</p>
                <p><i class="fas fa-phone"></i> +962 7X XXX XXXX</p>
            </div>
            <div class="contact-form">
                <input type="text" placeholder="Your Name">
                <input type="email" placeholder="Your Email">
                <textarea placeholder="Your Message" rows="5"></textarea>
                <button class="normal" id="sendBtn">Send Message</button>
                <p id="contact-msg"></p>
            </div>
        </div>
    </section>

</body>

</html>
